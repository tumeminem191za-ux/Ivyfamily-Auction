<!doctype html>
<html lang="th">

<head>

<meta charset="utf-8">

<title>Ivyfamily.Auction</title>


<style>

body{

font-family:sans-serif;

background:#0d0d12;

color:white;

padding:20px;

}


h1{

text-align:center;

color:#d8b4ff;

}


.card{

background:#1c1c25;

padding:20px;

border-radius:16px;

margin:15px 0;

box-shadow:0 0 10px #000;

}


.status{

text-align:center;

font-size:20px;

padding:10px;

border-radius:10px;

background:#292940;

}


input,select,button{

padding:10px;

margin:5px;

border-radius:8px;

border:none;

}


button{

background:#8b5cf6;

color:white;

cursor:pointer;

}


button:hover{

opacity:.8;

}


.item{

background:#292936;

padding:12px;

margin:8px 0;

border-radius:10px;

}


</style>


</head>



<body>



<h1>
🟣 Ivyfamily.Auction
</h1>


<div class="card">


<div id="status" class="status">

สถานะกำลังโหลด...

</div>


<p style="text-align:center">

ดูของ 21:00 - 21:10

<br>

ประมูล 21:10 - 21:40

</p>


</div>





<div class="card">


<h2>📝 ลงชื่อประมูล</h2>



<input id="name" placeholder="ชื่อผู้เล่น">


<select id="item">

<option>หลวนเฟิงลั่วหยาง</option>

<option>ญาณแท้เชี่ยวชาญชูโจว</option>

<option>ญาณแท้ชูโจว</option>

</select>



<select id="page">

<option>หน้า 1</option>

<option>หน้า 2</option>

<option>หน้า 3</option>

<option>หน้า 4</option>

<option>หน้า 5</option>

<option>หน้า 6</option>

<option>หน้า 7</option>

</select>


<input id="piece" placeholder="ชิ้นที่">


<br>


<button onclick="add()">

ส่งชื่อเข้าประมูล

</button>


</div>





<div class="card">


<h2>🔎 ดูรายการของฉัน</h2>


<input id="myname" placeholder="ชื่อผู้เล่น">


<button onclick="showMyList()">

ค้นหา

</button>


<div id="mylist"></div>


</div>






<div class="card">


<h2>

📋 รายชื่อผู้ประมูลทั้งหมด

</h2>


<div id="list"></div>


</div>




<script type="module" src="app.js"></script>



</body>

</html>
