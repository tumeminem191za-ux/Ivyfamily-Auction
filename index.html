<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Ivyfamily.Auction</title>
<style>
body{font-family:sans-serif;background:#101010;color:white;padding:20px}
.card{background:#222;padding:15px;border-radius:12px;margin:12px 0}
input,select,button{padding:8px;margin:4px}
button{cursor:pointer}
</style>
</head>
<body>
<h1>Ivyfamily.Auction</h1>
<div class="card">
<h3>เวลา</h3>
<p>ดูของ 21:00-21:10 | ประมูล 21:10-21:40</p>
</div>
<div class="card">
<h3>ลงชื่อประมูล</h3>
<input id="name" placeholder="ชื่อผู้เล่น">
<select id="item">
<option>หลวนเฟิงลั่วหยาง</option>
<option>ญาณแท้เชี่ยวชาญชูโจว</option>
<option>ญาณแท้ชูโจว</option>
</select>
<select id="page">
<option>หน้า 1</option><option>หน้า 2</option><option>หน้า 3</option>
<option>หน้า 4</option><option>หน้า 5</option><option>หน้า 6</option><option>หน้า 7</option>
</select>
<input id="piece" placeholder="ชิ้นที่">
<button onclick="add()">ส่งชื่อ</button>
</div>
<div class="card">
<h3>รายชื่อผู้ประมูล</h3>
<div id="list"></div>
</div>
<div class="card">
<h3>วงล้อแอดมิน</h3>
<button onclick="wheel()">หมุนวงล้อ</button>
<h2 id="result"></h2>
</div>
  <script type="module" src="firebase.js"></script>
<script src="app.js"></script>
</body>
</html>
