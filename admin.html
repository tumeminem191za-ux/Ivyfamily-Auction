<!doctype html>
<html lang="th">

<head>

<meta charset="utf-8">

<title>Ivyfamily Admin</title>


<style>

body{
font-family:sans-serif;
background:#0d0d12;
color:white;
padding:20px;
}


.card{
background:#1c1c25;
padding:20px;
border-radius:16px;
margin:15px 0;
}


button,input,select{
padding:10px;
margin:5px;
border-radius:8px;
border:none;
}


button{
background:#8b5cf6;
color:white;
cursor:pointer;
}


canvas{
background:#111;
border-radius:50%;
display:block;
margin:20px auto;
}


.player{
background:#292936;
padding:8px;
margin:5px;
border-radius:8px;
}


</style>


</head>


<body>


<h1>
🟣 Ivyfamily Admin
</h1>



<div class="card">


<h3>เข้าสู่ระบบ</h3>


<input id="pass" placeholder="รหัสแอดมิน">


<button onclick="login()">
เข้า
</button>


</div>





<div id="admin" style="display:none">



<div class="card">


<h2>🎡 Ivy Wheel</h2>



<select id="wheelItem">

<option>หลวนเฟิงลั่วหยาง</option>

<option>ญาณแท้เชี่ยวชาญชูโจว</option>

<option>ญาณแท้ชูโจว</option>


</select>



<br>


<button onclick="loadWheel()">
โหลดรายชื่อ
</button>


<div id="players"></div>



<canvas id="wheel" width="400" height="400"></canvas>


<button onclick="spin()">
🎡 หมุนวงล้อ
</button>



<h2 id="result"></h2>


</div>






<div class="card">


<h2>📜 ประวัติผู้ได้สิทธิ์</h2>


<div id="history"></div>


</div>




<div class="card">


<button onclick="clearAll()">
🗑 ล้างรายชื่อ
</button>


</div>




</div>



<script type="module" src="admin.js"></script>


</body>

</html>
