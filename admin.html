<!doctype html>
<html lang="th">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Ivyfamily Admin</title>


<style>

*{
box-sizing:border-box;
}

body{
font-family:sans-serif;
background:#0b0b12;
color:white;
padding:20px;
margin:0;
}


.card{

background:#1d1d27;
padding:20px;
border-radius:16px;
margin:15px 0;

}


button,input,select{

padding:12px;
margin:5px;

border-radius:10px;
border:none;

font-size:15px;

}


button{

background:#8b5cf6;
color:white;

font-weight:bold;

cursor:pointer;

}


button:hover{

opacity:.8;

}


input,select{

background:white;
color:black;

}


canvas{

display:block;

margin:20px auto;

background:#111;

border-radius:50%;

max-width:100%;

}



.player{

background:#292936;

padding:10px;

margin:5px 0;

border-radius:8px;

}




#winnerBox{

display:none;

position:fixed;

top:50%;

left:50%;

transform:translate(-50%,-50%);


background:#222;

border:3px solid gold;

border-radius:20px;

padding:35px;

width:90%;

max-width:450px;

text-align:center;

z-index:99;

box-shadow:0 0 30px gold;

}



#winnerName{

font-size:35px;

font-weight:bold;

margin:15px;

}



#winnerItem{

font-size:18px;

line-height:1.7;

}



.close{

background:#ef4444;

}



#result{

text-align:center;

color:#ffd700;

}


</style>


</head>



<body>


<h1>🟣 Ivyfamily Admin</h1>



<!-- LOGIN -->


<div class="card">


<h3>🔐 Login Admin</h3>


<input 
id="pass"
type="password"
placeholder="รหัสแอดมิน">


<button onclick="login()">
เข้า
</button>


</div>






<div id="admin" style="display:none">





<div class="card">


<h2>🎡 Ivy Winner Wheel</h2>



<select id="wheelItem">


<option value="หลวนเฟิงลั่วหยาง">
หลวนเฟิงลั่วหยาง
</option>


<option value="ญาณแท้เชี่ยวชาญชูโจว">
ญาณแท้เชี่ยวชาญชูโจว
</option>


<option value="ญาณแท้ชูโจว">
ญาณแท้ชูโจว
</option>


</select>


<br>



<button onclick="loadWheel()">
📋 โหลดรายชื่อ
</button>



<div id="players"></div>


<canvas
id="wheel"
width="450"
height="450">
</canvas>



<button
onclick="spin()"
style="font-size:20px">

🎡 หมุนวงล้อ

</button>



<h2 id="result"></h2>



</div>







<div class="card">


<h2>📜 ประวัติผู้ชนะ</h2>



<input
id="searchHistory"
placeholder="ค้นหา">


<button onclick="searchHistory()">
🔎 ค้นหา
</button>



<div id="history"></div>



</div>








<div class="card">


<h2>🗑 จัดการข้อมูล</h2>



<button
onclick="clearAll()"
style="background:#dc2626">

🗑 ล้างรายชื่อประมูล

</button>



<button
onclick="clearHistory()"
style="background:#f59e0b">

📜 ล้างประวัติผู้ชนะ

</button>



</div>



</div>







<!-- WINNER -->


<div id="winnerBox">


<h1>
🎉 ยินดีด้วย 🎉
</h1>


<div id="winnerName"></div>


<div id="winnerItem"></div>



<button
class="close"
onclick="closeWinner()">

ปิด

</button>



</div>






<script type="module" src="admin.js"></script>


</body>


</html>
