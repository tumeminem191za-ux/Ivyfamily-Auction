<!doctype html>
<html lang="th">

<head>

<meta charset="utf-8">

<title>Ivyfamily Admin</title>


<style>

body{
font-family:sans-serif;
background:#0b0b12;
color:white;
padding:20px;
}


.card{

background:#1d1d27;
padding:20px;
border-radius:16px;
margin:15px 0;

}


button,input,select{

padding:10px;
margin:5px;
border-radius:10px;
border:none;

}


button{

background:#8b5cf6;
color:white;
cursor:pointer;

}


canvas{

display:block;
margin:20px auto;
background:#111;
border-radius:50%;

}




.player{

background:#292936;
padding:8px;
margin:5px;
border-radius:8px;

}





/* Banner ผู้ชนะ */

#winnerBox{


display:none;

position:fixed;

top:50%;

left:50%;

transform:translate(-50%,-50%);


background:#222;

border:3px solid #ffd700;

border-radius:20px;


padding:35px;

text-align:center;


z-index:99;


box-shadow:0 0 30px #ffd700;


}



#winnerBox h1{

color:#ffd700;

}



#winnerName{

font-size:35px;

color:white;

font-weight:bold;

}



.close{

background:#ff595e;

}



</style>


</head>



<body>


<h1>
🟣 Ivyfamily Admin
</h1>





<div class="card">


<h3>เข้าสู่ระบบ</h3>


<input id="pass" placeholder="รหัสแอดมิน">


<button onclick="login()">
เข้า
</button>


</div>






<div id="admin" style="display:none">





<div class="card">


<h2>
🎡 Ivy Winner Wheel
</h2>



<select id="wheelItem">


<option>
หลวนเฟิงลั่วหยาง
</option>


<option>
ญาณแท้เชี่ยวชาญชูโจว
</option>


<option>
ญาณแท้ชูโจว
</option>


</select>



<br>


<button onclick="loadWheel()">
โหลดรายชื่อ
</button>



<div id="players"></div>



<canvas id="wheel" width="450" height="450"></canvas>



<button onclick="spin()">
🎡 เริ่มหมุน
</button>



<h2 id="result"></h2>


</div>







<div class="card">


<h2>
📜 ประวัติผู้ได้สิทธิ์
</h2>


<div id="history"></div>


</div>




<div class="card">


<button onclick="clearAll">

🗑 ล้างรายชื่อ

</button>


</div>





</div>







<!-- Banner -->

<div id="winnerBox">


<h1>
🎉 ยินดีด้วย 🎉
</h1>


<div id="winnerName"></div>


<p id="winnerItem"></p>


<button class="close" onclick="closeWinner()">
ปิด
</button>


</div>







<script type="module" src="admin.js"></script>



</body>


</html>
