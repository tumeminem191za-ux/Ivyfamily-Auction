<!doctype html>
<html lang="th">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Ivyfamily Admin</title>


<style>

*{
  box-sizing:border-box;
}

body{
  font-family:sans-serif;
  background:#0b0b12;
  color:white;
  padding:20px;
  margin:0;
}

.card{
  background:#1d1d27;
  padding:20px;
  border-radius:16px;
  margin:15px 0;
  box-shadow:
    0 5px 20px rgba(0,0,0,.25);
}

button,
input,
select{
  padding:12px;
  margin:5px;
  border-radius:10px;
  border:none;
  font-size:15px;
}

button{
  background:#8b5cf6;
  color:white;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  opacity:.85;
}

input,
select{
  background:white;
  color:#111;
}

canvas{
  display:block;
  margin:20px auto;
  background:#111;
  border-radius:50%;
  max-width:100%;
}

.player{
  background:#292936;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
}

#winnerBox{
  display:none;
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#222;
  border:3px solid #ffd700;
  border-radius:20px;
  padding:35px;
  text-align:center;
  z-index:99;
  width:min(90%,450px);
  box-shadow:0 0 30px #ffd700;
}

#winnerBox h1{
  color:#ffd700;
  margin-top:0;
}

#winnerName{
  font-size:35px;
  color:white;
  font-weight:bold;
  margin:15px 0;
}

#winnerItem{
  font-size:18px;
  line-height:1.7;
}

.close{
  background:#ff595e;
}

.close:hover{
  background:#dc2626;
}

#result{
  color:#ffd700;
  text-align:center;
}

.status{
  padding:10px;
  border-radius:10px;
  background:#292936;
  margin-top:10px;
}

.danger{
  background:#dc2626;
}

.warning{
  background:#f59e0b;
}

</style>

</head>


<body>


<h1>🟣 Ivyfamily Admin</h1>


<!-- ========================= -->
<!-- LOGIN -->
<!-- ========================= -->

<div class="card">

  <h3>
    🔐 เข้าสู่ระบบ Admin
  </h3>

  <input
    id="pass"
    type="password"
    placeholder="รหัสแอดมิน"
  >

  <button onclick="login()">
    เข้า
  </button>

</div>


<div
  id="admin"
  style="display:none"
>


<!-- ========================= -->
<!-- WHEEL -->
<!-- ========================= -->

<div class="card">

  <h2>
    🎡 Ivy Winner Wheel
  </h2>


  <select id="wheelItem">

    <option value="หลวนเฟิงลั่วหยาง">
      หลวนเฟิงลั่วหยาง
    </option>

    <option value="ญาณแท้เชี่ยวชาญชูโจว">
      ญาณแท้เชี่ยวชาญชูโจว
    </option>

    <option value="ญาณแท้ชูโจว">
      ญาณแท้ชูโจว
    </option>

    <option value="เสียงสวรรค์ลั่วหยาง">
      เสียงสวรรค์ลั่วหยาง
    </option>

    <option value="หยกวิญญานฟ้า">
      หยกวิญญานฟ้า
    </option>

    <option value="ลายปักเมฆสูงส่ง">
      ลายปักเมฆสูงส่ง
    </option>


    <!-- ================= -->
    <!-- ไอเทมใหม่ -->
    <!-- ================= -->

    <option value="ญาณแท้เชี่ยวชาญต้าหลี่">
      ญาณแท้เชี่ยวชาญต้าหลี่
    </option>

    <option value="ทำนายสู่จง">
      ทำนายสู่จง
    </option>

    <option value="ญานแท้ต้าหลี่">
      ญานแท้ต้าหลี่
    </option>

  </select>


  <br>


  <button onclick="loadWheel()">
    📋 โหลดรายชื่อ
  </button>


  <div id="players"></div>


  <canvas
    id="wheel"
    width="450"
    height="450"
  ></canvas>


  <button
    onclick="spin()"
    style="
      font-size:20px;
      padding:14px 30px;
    "
  >
    🎡 เริ่มหมุน
  </button>


  <h2 id="result"></h2>

</div>


<!-- ========================= -->
<!-- HISTORY -->
<!-- ========================= -->

<div class="card">

  <h2>
    📜 ประวัติผู้ได้สิทธิ์
  </h2>


  <input
    id="searchHistory"
    placeholder="ค้นหาไอเทมหรือชื่อ"
  >


  <button onclick="searchHistory()">
    🔎 ค้นหา
  </button>


  <button onclick="loadHistory()">
    🔄 แสดงทั้งหมด
  </button>


  <div id="history"></div>

</div>


<!-- ========================= -->
<!-- DELETE -->
<!-- ========================= -->

<div class="card">

  <h3>
    🗑 จัดการข้อมูล
  </h3>


  <p>
    ใช้สำหรับล้างข้อมูลเพื่อทดสอบระบบ
  </p>


  <button
    onclick="clearAll()"
    class="danger"
  >
    🗑 ล้างรายชื่อประมูล
  </button>


  <button
    onclick="clearHistory()"
    class="warning"
  >
    📜 ล้างประวัติผู้ชนะ
  </button>

</div>


</div>


<!-- ========================= -->
<!-- WINNER POPUP -->
<!-- ========================= -->

<div id="winnerBox">

  <h1>
    🎉 ยินดีด้วย 🎉
  </h1>


  <div id="winnerName"></div>


  <div id="winnerItem"></div>


  <button
    class="close"
    onclick="closeWinner()"
  >
    ปิด
  </button>

</div>


<script
  type="module"
  src="admin.js"
></script>


</body>

</html>
